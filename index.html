<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Du Học Cost Manager (Demo)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
    <!-- Preconnect to API for faster requests -->
    <link rel="preconnect" href="https://project-v0ez.onrender.com" />
    <link rel="dns-prefetch" href="https://project-v0ez.onrender.com" />
    <!-- Preload critical CSS -->
    <link rel="preload" href="/src/styles/index.css" as="style" />
    <style>
      /* Critical CSS inline for instant render */
      #root:empty::before {
        content: '';
        display: block;
        width: 40px;
        height: 40px;
        border: 3px solid #f3f4f6;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        position: fixed;
        top: 50%;
        left: 50%;
        margin: -20px 0 0 -20px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
